# Backend + Cloudflare tunnel on an Oracle Always Free VM.
#
# The tunnel is what gives this HTTPS. It dials out to Cloudflare, so no
# inbound port is opened and neither the OCI security list nor the VM's own
# iptables needs touching -- which is where most Oracle deployments stall.
#
#   docker compose up -d --build
#   docker compose logs -f tunnel     # the https:// URL appears here
#
# Run from the repository root:
#   docker compose -f deploy/oracle/docker-compose.yml up -d --build

services:
  backend:
    build:
      # The repo root, so the image can COPY data/ and models/.
      context: ../..
      dockerfile: deploy/oracle/Dockerfile.backend
    restart: unless-stopped
    environment:
      # The Vercel origin(s) allowed to call this API. Comma-separated, no
      # trailing slash. Parsing this from the environment used to crash the
      # app at startup; fixed in dced506.
      COSMORA_CORS_ORIGINS: "${VERCEL_ORIGINS:-https://COSMORA.vercel.app}"
    volumes:
      # Job results survive a container restart. data/ and models/ are baked
      # into the image and deliberately not mounted: they are evidence, and a
      # volume would let them drift from the commit that produced them.
      - COSMORA-runtime:/srv/runtime
    # Not published to the host. The tunnel reaches it over the compose
    # network, so the API is never exposed on the VM's public interface.
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          # An Ampere A1 Always Free shape is 4 OCPU / 24 GB if you get the
          # whole allowance. Capping keeps one runaway job from taking the box
          # down with the tunnel still up and answering.
          memory: 6g

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Quick tunnel: no account, no domain, free HTTPS. The URL is random and
    # changes if this container restarts, which on a server is rare -- but see
    # the README for the named-tunnel setup if you need a fixed hostname.
    command: tunnel --no-autoupdate --url http://backend:8000

volumes:
  COSMORA-runtime:
