name: backend-ci

on:
  push:
    paths:
      - 'backend/**'
      - 'models/**'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'models/**'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # 3.11 exactly: the pinned dependency set does not resolve on 3.12+, and
      # the ML bundle needs scikit-learn 1.7.1 with NumPy 2.x.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      # No network fetch here: the five approved structures are committed, so CI
      # is not at the mercy of RCSB availability. This step only regenerates
      # derived files and asserts the inputs are present.
      - name: Verify environment
        run: python scripts/validate_environment.py

      - name: Verify the ML bundle reproduces its published metrics
        run: python scripts/validate_model.py

      - name: Check the generated feature schema is up to date
        run: |
          cp models/feature_schema.json /tmp/feature_schema.before.json
          python scripts/generate_feature_schema.py
          if ! diff -q /tmp/feature_schema.before.json models/feature_schema.json; then
            echo "::error::models/feature_schema.json is stale. Run: python scripts/generate_feature_schema.py"
            diff /tmp/feature_schema.before.json models/feature_schema.json || true
            exit 1
          fi

      - name: Lint
        run: ruff check backend/app backend/tests scripts

      # Excludes the slow OpenMM runs by default; see the openmm-smoke job.
      - name: Test
        working-directory: backend
        run: python -m pytest -q -m "not slow" --tb=short

  openmm-smoke:
    # A real OpenMM run is slow, so it is a separate job rather than blocking
    # the fast feedback loop.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Report available OpenMM platforms
        run: |
          python - <<'PY'
          from openmm import Platform
          names = [Platform.getPlatform(i).getName() for i in range(Platform.getNumPlatforms())]
          print("platforms:", ", ".join(names))
          PY

      - name: Run the real OpenMM tests
        working-directory: backend
        run: python -m pytest -q -m slow --tb=short

      - name: Run one end-to-end simulation
        run: python scripts/run_demo_simulation.py --preset-id minimisation_only

      - name: Upload job artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-jobs
          path: runtime/
          retention-days: 5
