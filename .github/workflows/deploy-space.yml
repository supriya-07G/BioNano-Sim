name: deploy-space

# Mirrors this repository to a Hugging Face Space on every push to main, so
# GitHub stays the single place you push to. The Space itself must be created
# once in the Hugging Face UI (Docker SDK); see docs/DEPLOYMENT.md.
#
# Required repository settings:
#   Secrets   -> HF_TOKEN      a Hugging Face access token with *write* scope
#   Variables -> HF_USERNAME   your Hugging Face username
#   Variables -> HF_SPACE      the Space name, e.g. BioNano-Sim

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The Space is a git repo of its own; a shallow clone cannot be
          # pushed to it.
          fetch-depth: 0
          lfs: true

      # Deployment is opt-in. Until the Space exists and the three settings are
      # filled in, this skips with a notice rather than failing, so an
      # unconfigured repo does not show a permanent red X on every push.
      - name: Check whether deployment is configured
        id: check
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          missing=""
          [ -z "$HF_TOKEN" ] && missing="$missing HF_TOKEN(secret)"
          [ -z "${{ vars.HF_USERNAME }}" ] && missing="$missing HF_USERNAME(variable)"
          [ -z "${{ vars.HF_SPACE }}" ] && missing="$missing HF_SPACE(variable)"
          if [ -n "$missing" ]; then
            echo "::notice::Hugging Face deployment skipped. Not configured:$missing. See docs/DEPLOYMENT.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push to the Space
        if: steps.check.outputs.ready == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # --force because the Space is created with its own initial commit,
          # which is not an ancestor of this history. GitHub stays the source
          # of truth; the Space is a deployment target only.
          git push --force \
            "https://${{ vars.HF_USERNAME }}:$HF_TOKEN@huggingface.co/spaces/${{ vars.HF_USERNAME }}/${{ vars.HF_SPACE }}" \
            HEAD:main
